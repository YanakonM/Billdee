name: Release Billdee

# Trigger: push a version tag like v0.1.5 (or run manually)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build, sign & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Billdee ${{ github.ref_name }}'
          releaseBody: |
            ติดตั้งจากไฟล์ด้านล่าง หรือกด "ตรวจหาอัปเดต" ในแอป Billdee เดิมเพื่ออัปเดตอัตโนมัติ

            ใหม่ในเวอร์ชันนี้:
            - อัปเดต Vite เป็น 8.1.4 และล็อก dependency ให้ผ่าน audit
            - แยก bundle และ lazy-load หน้าสแกนบาร์โค้ดเพื่อลดขนาดไฟล์เริ่มต้น
            - เพิ่ม guard/index ของ SQLite สำหรับเลขเอกสารซ้ำใน invoice, quotation และ credit note
            - เพิ่ม GitHub Actions CI สำหรับ audit, test, build, e2e และ cargo check
          releaseDraft: false
          prerelease: false
