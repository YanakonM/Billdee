name: Release Billdee

# Trigger: push a version tag like v0.1.5 (or run manually)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm ci

      - name: Build, sign & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Billdee ${{ github.ref_name }}'
          releaseBody: |
            ติดตั้งจากไฟล์ด้านล่าง หรือกด "ตรวจหาอัปเดต" ในแอป Billdee เดิมเพื่ออัปเดตอัตโนมัติ

            ใหม่ในเวอร์ชันนี้:
            - ค้นหาสินค้าเร็วและแม่นขึ้น — พิมพ์ตัวแรกก็ขึ้นผลทันที, รหัส/บาร์โค้ดที่ตรงเป๊ะมาก่อนเสมอ, เลือกด้วย ↑↓ + Enter ได้
            - ผลค้นหาในหน้าออกบิลแสดงจำนวนคงเหลือ (เขียว/ใกล้หมด/สต็อคหมด) และคลิกช่องค้นหาก็เห็นสินค้าล่าสุดเลย
            - ปุ่ม "นำออก / นำเข้า" ในหน้าจัดการสินค้า — ย้ายเฉพาะข้อมูลสินค้า/สต็อคไปอีกเครื่องได้ทั้งไฟล์ JSON และ Excel/CSV
            - นำเข้าซ้ำไม่เกิดรายการซ้ำ (จับคู่ด้วยบาร์โค้ด → รหัส → ชื่อ) เลือกได้ว่าจะรวมกับของเดิมหรือแทนที่ทั้งหมด
          releaseDraft: false
          prerelease: false
